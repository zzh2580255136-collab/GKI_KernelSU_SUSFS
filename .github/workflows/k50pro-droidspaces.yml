name: K50 Pro 5.10.66 Droidspaces experiment
on:
  push:
    branches: [dev]
    paths: [.github/workflows/k50pro-droidspaces.yml]
  workflow_dispatch:
    inputs:
      droidspaces:
        description: 'Patch variant: off for baseline; 678 recommended first'
        type: choice
        required: true
        default: '678'
        options: ['off', '678', '123', '345']
permissions:
  contents: write
  actions: write
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      android_version: android12
      kernel_version: '5.10'
      sub_level: '66'
      os_patch_level: '2022-01'
      revision: r11
      ksu_variant: ReSukiSU
      version: ''
      use_zram: false
      use_bbg: false
      use_kpm: 'disabled (�ر�)'
      use_rekernel: false
      enable_susfs: true
      supp_op: false
      droidspaces: ${{ inputs.droidspaces || '678' }}
      droidspaces_ntsync: false
      artifact_upload_mode: '�ϴ�ȫ��'
  manager:
    uses: ./.github/workflows/get-manager.yml
    with:
      kernelsu_variant: ReSukiSU

